services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibe_plan}
      POSTGRES_USER: ${POSTGRES_USER:-vibe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibe} -d ${POSTGRES_DB:-vibe_plan}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ${VIBE_PLAN_REGISTRY:-ccr.ccs.tencentyun.com}/${VIBE_PLAN_NAMESPACE:-jayden}/vibe-plan-api:${VIBE_PLAN_VERSION:?VIBE_PLAN_VERSION is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vibe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vibe_plan}
      API_PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:?AUTH_ACCESS_SECRET is required}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-30m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-90d}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vibe.local}
      APP_BASE_URL: ${APP_BASE_URL:-}
      VIBE_PLAN_DOMAIN: ${VIBE_PLAN_DOMAIN:?VIBE_PLAN_DOMAIN is required}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-alipay}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-https://vibeplan.szxinjin.cn/api/billing/alipay/notify}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-https://vibeplan.szxinjin.cn/organizations/ORGANIZATION_ID/billing/return}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${VIBE_PLAN_REGISTRY:-ccr.ccs.tencentyun.com}/${VIBE_PLAN_NAMESPACE:-jayden}/vibe-plan-web:${VIBE_PLAN_VERSION:?VIBE_PLAN_VERSION is required}
    restart: unless-stopped
    links:
      - api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik-public}
      - traefik.http.routers.vibe-plan.rule=Host(`${VIBE_PLAN_DOMAIN:?VIBE_PLAN_DOMAIN is required}`)
      - traefik.http.routers.vibe-plan.entrypoints=websecure
      - traefik.http.routers.vibe-plan.tls=true
      - traefik.http.routers.vibe-plan.tls.certresolver=myresolver
      - traefik.http.services.vibe-plan.loadbalancer.server.port=80

networks:
  default:
    name: vibe-plan-internal
  traefik-public:
    name: ${TRAEFIK_NETWORK:-traefik-public}
    external: true
